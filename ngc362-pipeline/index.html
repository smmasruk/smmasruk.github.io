<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGC 0362 Pipeline</title>
<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/space-grotesk-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;--fg:#e6edf3;--fg2:#8b949e;
  --accent:#58a6ff;--accent2:#3fb950;--warn:#d29922;--bad:#f85149;
  --axis:#484f58;--fg-rgb:230,237,243;--surface-rgb:22,27,34;
  --star-rgb:180,210,255;--star-boost:1;--blue-rgb:88,166,255;--kept-rgb:63,185,80;
  --orange-rgb:255,166,87;--bad-rgb:248,81,73;--muted-rgb:140,160,180;--ridge-rgb:255,123,114;--gold-rgb:255,215,0;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f4f8;--surface:#fff;--border:#d0d7de;--fg:#1f2328;--fg2:#57606a;
  --accent:#0969da;--accent2:#1a7f37;--warn:#9a6700;--bad:#cf222e;
  --axis:#8c959f;--fg-rgb:31,35,40;--surface-rgb:255,255,255;
  --star-rgb:20,50,120;--star-boost:1.5;--blue-rgb:9,105,218;--kept-rgb:26,127,55;
  --orange-rgb:188,76,0;--bad-rgb:207,34,46;--muted-rgb:60,76,98;--ridge-rgb:207,34,46;--gold-rgb:166,118,0;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f0f4f8;--surface:#fff;--border:#d0d7de;--fg:#1f2328;--fg2:#57606a;
  --accent:#0969da;--accent2:#1a7f37;--warn:#9a6700;--bad:#cf222e;
  --axis:#8c959f;--fg-rgb:31,35,40;--surface-rgb:255,255,255;
  --star-rgb:20,50,120;--star-boost:1.5;--blue-rgb:9,105,218;--kept-rgb:26,127,55;
  --orange-rgb:188,76,0;--bad-rgb:207,34,46;--muted-rgb:60,76,98;--ridge-rgb:207,34,46;--gold-rgb:166,118,0;
  color-scheme:light;
}
:root{--orange:rgb(var(--orange-rgb));--gold:rgb(var(--gold-rgb));--ridge:rgb(var(--ridge-rgb))}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.6}

/* app fills exactly one screen on desktop */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1360px;margin:0 auto}
@media(min-width:1362px){.app{border-inline:1px solid var(--border)}}
header{flex:none;background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--accent);line-height:1.35}
header small{display:block;font-size:11px;color:var(--fg2)}
.step-pill{font-size:12px;color:var(--fg);background:var(--border);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,32vw,440px);grid-template-rows:minmax(0,1fr)}
.cmd-panel{min-width:0;min-height:0;padding:14px 16px 8px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border)}
.plot-wrap{flex:1;min-height:0;position:relative}
.plot-wrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;border-radius:8px;background:var(--surface);box-shadow:0 0 0 1px var(--border)}
.cmd-label{flex:none;font-size:11px;color:var(--fg2);text-align:center}
.sidebar{min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.step-info{flex:none;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.step-num{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.step-title{font-size:19px;font-weight:700;line-height:1.3;text-wrap:balance}
.step-body{font-size:13.5px;color:var(--fg2);line-height:1.65}
.step-body p{margin-bottom:8px}
.step-body strong{color:var(--fg)}
.step-body code{background:var(--border);border-radius:3px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:12px;color:var(--fg);overflow-wrap:anywhere}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px}
.stat b{color:var(--accent);font-size:15px;display:block}
.zoom-panel{flex:none;margin-top:auto;border-top:1px solid var(--border);padding:12px;background:var(--surface)}
.zoom-panel canvas{display:block;margin:0 auto;border-radius:6px;box-shadow:0 0 0 1px var(--border)}
.zoom-label{font-size:11px;color:var(--fg2);text-align:center;margin-top:6px}
nav{flex:none;background:var(--surface);border-top:1px solid var(--border);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center;gap:18px}
.nav-btn{flex:none;min-width:96px;background:var(--border);border:none;color:var(--fg);border-radius:6px;padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;transition:background .15s}
.nav-btn:hover:not(:disabled){background:var(--accent);color:var(--bg)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:var(--accent);color:var(--bg);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress-dots{display:flex;justify-content:center;flex-wrap:wrap;min-width:0}
.dot{width:20px;height:24px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--axis);transition:background .2s}
.dot.done::before{background:var(--accent2)}
.dot.active::before{background:var(--accent);box-shadow:0 0 0 3px rgba(var(--blue-rgb),.3)}

/* short landscape windows: keep two columns, trim the bars */
@media(min-width:781px) and (max-height:520px){
  header{padding-block:3px} header small{display:none}
  .cmd-panel{padding:6px 10px 4px} .cmd-label{display:none}
  nav{padding-block:3px}
}
/* phones: stack and scroll, keep the buttons reachable */
@media(max-width:780px){
  .app{height:auto;min-height:100vh;min-height:100dvh}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .cmd-panel{border-right:0;border-bottom:1px solid var(--border);padding:10px 12px 8px}
  .plot-wrap{flex:none;height:max(300px,min(112vw,68vh));height:max(300px,min(112vw,68svh))}
  .sidebar{overflow:visible}
  header{padding-block:6px;padding-inline:14px}
  header>div{min-width:0}
  header small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{position:sticky;bottom:0;z-index:5;gap:8px;justify-content:space-between}
  .nav-btn{min-width:78px;padding:9px 12px}
  .dot{width:14px}
}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:99;padding:20px}
#loading p{color:var(--fg2);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Loading NGC 0362 photometry…</p></div>

<div class="app" id="app" style="display:none">
  <header>
    <div>
      <h1>Ridge-Line Pipeline</h1>
      <small>Real data — NGC 0362 / HUGS Meth2 (HST/ACS)</small>
    </div>
    <span class="step-pill" id="stepPill">Step 1 of 10</span>
  </header>
  <div class="main">
    <div class="cmd-panel">
      <div class="plot-wrap" id="plotWrap"><canvas id="cmdCanvas" role="img" aria-label="Colour-magnitude diagram of NGC 0362 for the current step"></canvas></div>
      <div class="cmd-label">CMD: F606W−F814W (colour) vs F814W (magnitude, brighter up)</div>
    </div>
    <div class="sidebar">
      <div class="step-info" id="stepInfo"></div>
      <div class="zoom-panel" id="zoomPanel" style="display:none">
        <canvas id="zoomCanvas"></canvas>
        <div class="zoom-label" id="zoomLabel"></div>
      </div>
    </div>
  </div>
  <nav>
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <div class="progress-dots" id="dots"></div>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </nav>
</div>

<script>
// ── globals ───────────────────────────────────────────────────────────────────
let stars, ridge, fid, rbins, MSTO_M, MSTO_C;

function init(D) {
  // flag: 0=failed QC, 1=passed QC not ridge-selected, 2=ridge-selected
  stars  = D.stars.map(r => ({c:r[0], m:r[1], ec:r[2], flag:r[3]}));
  ridge  = D.ridge;
  fid    = D.fid;
  rbins  = D.rbins;
  MSTO_M = D.msto[0];
  MSTO_C = D.msto[1];
}

// ── canvas setup ──────────────────────────────────────────────────────────────
const CMD = document.getElementById('cmdCanvas');
const ctx  = CMD.getContext('2d');

const CMIN=0.0,CMAX=1.6,MMIN=14.0,MMAX=24.0;
let VW=560, VH=520, K=1;                       // logical plot size and size factor
let PAD={l:46,r:12,t:16,b:36}, CW=0, CH=0;
const T={};                                    // theme colours read from CSS

function readTheme(){
  const st=getComputedStyle(document.documentElement);
  ['fg2','axis','fg-rgb','surface-rgb','star-rgb','star-boost','blue-rgb','kept-rgb',
   'orange-rgb','bad-rgb','muted-rgb','ridge-rgb','gold-rgb','accent'].forEach(n=>T[n]=st.getPropertyValue('--'+n).trim());
}
const rgba=(name,a=1)=>`rgba(${T[name+'-rgb']},${a})`;
const starCol=a=>rgba('star',Math.min(0.9,a*Number(T['star-boost'])));
const font=(px,bold)=>`${bold?'700 ':''}${px}px 'Space Grotesk',system-ui,sans-serif`;
const fs=()=>VW<440?11:Math.min(14,Math.round(12*K));

function sizeCanvas(cv,c2d,w,h){
  const d=window.devicePixelRatio||1;
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  c2d.setTransform(d,0,0,d,0,0);
}

function sizePlot(){
  const wrap=document.getElementById('plotWrap');
  const h=Math.max(240,wrap.clientHeight-2);
  const w=Math.max(240,Math.floor(Math.min(wrap.clientWidth-2,h*1.15)));
  VW=w;VH=h;K=Math.max(0.8,Math.min(1.35,Math.min(w/600,h/520)));
  sizeCanvas(CMD,ctx,w,h);
  PAD={l:w<440?42:52,r:12,t:12,b:w<440?36:42};
  CW=VW-PAD.l-PAD.r;CH=VH-PAD.t-PAD.b;
}

function cx(c){return PAD.l+(c-CMIN)/(CMAX-CMIN)*CW}
function cy(m){return PAD.t+(m-MMIN)/(MMAX-MMIN)*CH}

// text on a translucent backing so it stays readable over dense star fields
function label(c2d,text,x,y,color,align='left',px=fs(),bold=false){
  c2d.save();c2d.font=font(px,bold);c2d.textAlign='left';c2d.textBaseline='middle';
  const w=c2d.measureText(text).width;
  const x0=align==='right'?x-w:align==='center'?x-w/2:x;
  c2d.fillStyle=rgba('surface',0.86);c2d.fillRect(x0-4,y-px*0.75,w+8,px*1.5);
  c2d.fillStyle=color;c2d.fillText(text,x0,y+0.5);
  c2d.restore();
}

// draws the frame, then clips everything that follows to the plot area
function drawAxes(){
  const px=fs();
  ctx.strokeStyle=T.axis;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(PAD.l,PAD.t);ctx.lineTo(PAD.l,PAD.t+CH);
  ctx.lineTo(PAD.l+CW,PAD.t+CH);ctx.stroke();
  ctx.fillStyle=T.fg2;ctx.font=font(px);
  ctx.textAlign='right';ctx.textBaseline='middle';
  for(let m=14;m<=24;m+=2){const y=cy(m);ctx.beginPath();ctx.moveTo(PAD.l-4,y);ctx.lineTo(PAD.l,y);ctx.stroke();ctx.fillText(m,PAD.l-7,y);}
  ctx.textAlign='center';ctx.textBaseline='top';
  for(let i=1;i<=7;i++){const c=i*0.2,x=cx(c);ctx.beginPath();ctx.moveTo(x,PAD.t+CH);ctx.lineTo(x,PAD.t+CH+4);ctx.stroke();ctx.fillText(c.toFixed(1),x,PAD.t+CH+7);}
  ctx.textBaseline='alphabetic';
  ctx.save();ctx.translate(13,PAD.t+CH/2);ctx.rotate(-Math.PI/2);ctx.fillText('F814W',0,0);ctx.restore();
  ctx.fillText('F606W − F814W',PAD.l+CW/2,VH-7);
  ctx.beginPath();ctx.rect(PAD.l,PAD.t,CW,CH);ctx.clip();
}

function plotStars(arr,color,r){
  ctx.fillStyle=color;
  arr.forEach(s=>{ctx.beginPath();ctx.arc(cx(s.c),cy(s.m),r*K*1.08,0,2*Math.PI);ctx.fill();});
}

function drawRidge(col){
  ctx.strokeStyle=col;ctx.lineWidth=2*K;ctx.setLineDash([]);
  ctx.beginPath();let first=true;
  ridge.forEach(([m,c])=>{
    if(m<MMIN||m>MMAX||c<CMIN||c>CMAX)return;
    if(first){ctx.moveTo(cx(c),cy(m));first=false;}else ctx.lineTo(cx(c),cy(m));
  });
  ctx.stroke();
}

function drawBinLines(alpha){
  ctx.strokeStyle=rgba('blue',alpha);ctx.lineWidth=0.8;
  for(let m=14.5;m<23;m+=0.15){
    const y=cy(m);ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+CW,y);ctx.stroke();
  }
}

function getRidgeC(m){
  for(let i=0;i<ridge.length-1;i++){
    if(ridge[i][0]<=m&&ridge[i+1][0]>m){
      const t=(m-ridge[i][0])/(ridge[i+1][0]-ridge[i][0]);
      return ridge[i][1]+t*(ridge[i+1][1]-ridge[i][1]);
    }
  }
  return null;
}

function drawCorridor(){
  const DC=0.04,m0=MSTO_M-1,m1=MSTO_M+2.5;
  ctx.save();ctx.globalAlpha=0.12;ctx.fillStyle=rgba('kept');
  ctx.beginPath();let first=true;
  for(let m=m0;m<=m1;m+=0.1){const c=getRidgeC(m)-DC;if(c==null)continue;if(first){ctx.moveTo(cx(c),cy(m));first=false;}else ctx.lineTo(cx(c),cy(m));}
  for(let m=m1;m>=m0;m-=0.1){const c=getRidgeC(m)+DC;if(c==null)continue;ctx.lineTo(cx(c),cy(m));}
  ctx.closePath();ctx.fill();ctx.restore();
  ctx.strokeStyle=rgba('kept',0.6);ctx.lineWidth=1.2;ctx.setLineDash([4,3]);
  ['l','r'].forEach(side=>{
    ctx.beginPath();let f2=true;
    for(let m=m0;m<=m1;m+=0.1){const c=getRidgeC(m)+(side==='r'?DC:-DC);if(c==null)continue;if(f2){ctx.moveTo(cx(c),cy(m));f2=false;}else ctx.lineTo(cx(c),cy(m));}
    ctx.stroke();
  });
  ctx.setLineDash([]);
}

function drawMagWindow(){
  const y0=cy(MSTO_M-1),y1=cy(MSTO_M+2.5);
  ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle=rgba('blue');
  ctx.fillRect(PAD.l,Math.min(y0,y1),CW,Math.abs(y1-y0));ctx.restore();
  ctx.strokeStyle=rgba('blue',0.6);ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
  [y0,y1].forEach(y=>{ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+CW,y);ctx.stroke();});
  ctx.setLineDash([]);
  label(ctx,`MSTO−1 = ${(MSTO_M-1).toFixed(2)}`,PAD.l+CW-8,y0-11,rgba('blue'),'right');
  label(ctx,`MSTO+2.5 = ${(MSTO_M+2.5).toFixed(2)}`,PAD.l+CW-8,y1+12,rgba('blue'),'right');
}

function drawMSTO(){
  const x=cx(MSTO_C),y=cy(MSTO_M),r=10*K;
  ctx.strokeStyle=rgba('orange');ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.stroke();
  ctx.fillStyle=rgba('orange',0.55);ctx.beginPath();ctx.arc(x,y,r*0.4,0,2*Math.PI);ctx.fill();
  const t=`MSTO  ${MSTO_M.toFixed(2)} mag`;
  ctx.font=font(fs(),true);
  const left=x-r-8-ctx.measureText(t).width>PAD.l+6;   // empty sky is blueward of the turn-off
  label(ctx,t,left?x-r-8:x+r+8,y,rgba('orange'),left?'right':'left',fs(),true);
}

function drawFidBinLines(){
  ctx.strokeStyle=rgba('gold',0.5);ctx.lineWidth=1;ctx.setLineDash([3,3]);
  fid.forEach(f=>{const y=cy(f[4]);ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+CW,y);ctx.stroke();});
  ctx.setLineDash([]);
}

function drawFidPoints(){
  fid.forEach(f=>{
    const x=cx(f[1]),y=cy(f[0]),sc=f[2];
    ctx.strokeStyle=rgba('gold',0.85);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx(f[1]-sc),y);ctx.lineTo(cx(f[1]+sc),y);ctx.stroke();
    ctx.fillStyle=rgba('gold');ctx.strokeStyle=rgba('fg',0.9);ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,4.5*K,0,2*Math.PI);ctx.fill();ctx.stroke();
  });
}

// ── zoom canvas ───────────────────────────────────────────────────────────────
const ZC   = document.getElementById('zoomCanvas');
const zctx = ZC.getContext('2d');
let ZW=300, ZH=190;

function sizeZoom(){
  const p=document.getElementById('zoomPanel');
  const w=Math.max(240,Math.min(520,p.clientWidth-24));
  const cap=Math.max(190,Math.round(window.innerHeight*0.31));
  ZW=w;ZH=Math.max(180,Math.min(cap,Math.round(w*0.66)));
  sizeCanvas(ZC,zctx,ZW,ZH);
}

function drawHistogram(binIdx){
  const binM=rbins[binIdx][0], BW=0.15;
  const inBin=stars.filter(s=>s.m>=binM-BW/2&&s.m<binM+BW/2);
  if(!inBin.length)return;
  const cols=inBin.map(s=>s.c).sort((a,b)=>a-b);
  const p1=cols[Math.floor(cols.length*0.01)];
  const p99=cols[Math.floor(cols.length*0.99)];
  const HBINS=50,hStep=(p99-p1)/HBINS;
  const counts=new Array(HBINS).fill(0);
  cols.forEach(c=>{const b=Math.min(HBINS-1,Math.floor((c-p1)/hStep));counts[b]++;});
  const maxC=Math.max(...counts);
  const pad={l:30,r:10,t:24,b:34};
  const W=ZW-pad.l-pad.r,H=ZH-pad.t-pad.b;
  zctx.clearRect(0,0,ZW,ZH);
  zctx.strokeStyle=T.axis;zctx.lineWidth=1;
  zctx.beginPath();zctx.moveTo(pad.l,pad.t);zctx.lineTo(pad.l,pad.t+H);zctx.lineTo(pad.l+W,pad.t+H);zctx.stroke();
  const bw=W/HBINS;
  counts.forEach((c,i)=>{
    const bh=H*c/maxC;
    zctx.fillStyle=c===maxC?rgba('orange'):rgba('blue',0.6);
    zctx.fillRect(pad.l+i*bw,pad.t+H-bh,Math.max(1,bw-1),bh);
  });
  const mi=counts.indexOf(maxC),mx=pad.l+(mi+0.5)*bw,mc=p1+(mi+0.5)*hStep;
  zctx.strokeStyle=rgba('orange');zctx.lineWidth=1.5;zctx.setLineDash([3,3]);
  zctx.beginPath();zctx.moveTo(mx,pad.t);zctx.lineTo(mx,pad.t+H);zctx.stroke();zctx.setLineDash([]);
  zctx.font=font(11,true);zctx.fillStyle=rgba('orange');zctx.textAlign='left';
  zctx.fillText(`peak: ${mc.toFixed(3)}`,pad.l,14);
  zctx.font=font(11);zctx.fillStyle=T.fg2;
  zctx.fillText(p1.toFixed(2),pad.l,pad.t+H+13);
  zctx.textAlign='right';zctx.fillText(p99.toFixed(2),pad.l+W,pad.t+H+13);
  zctx.fillText(`N=${inBin.length}  F814W≈${binM.toFixed(2)}`,ZW-pad.r,14);
  zctx.textAlign='center';zctx.fillText('colour F606W−F814W',pad.l+W/2,ZH-5);
  zctx.save();zctx.translate(13,pad.t+H/2);zctx.rotate(-Math.PI/2);zctx.fillText('N stars',0,0);zctx.restore();
}

function drawFidKDE(fidIdx){
  const f=fid[fidIdx];
  const inBin=stars.filter(s=>s.m>=f[4]&&s.m<f[5]&&s.flag===2);
  if(!inBin.length)return;
  const cols=inBin.map(s=>s.c),mags=inBin.map(s=>s.m);
  const c0=Math.min(...cols)-0.03,c1=Math.max(...cols)+0.03;
  const m0f=Math.min(...mags)-0.03,m1f=Math.max(...mags)+0.03;
  const pad={l:30,r:10,t:24,b:24};
  const W=ZW-pad.l-pad.r,H=ZH-pad.t-pad.b;
  zctx.clearRect(0,0,ZW,ZH);
  const xcv=c=>pad.l+(c-c0)/(c1-c0)*W;
  const ymv=m=>pad.t+(m-m0f)/(m1f-m0f)*H;
  zctx.strokeStyle=T.axis;zctx.lineWidth=1;
  zctx.beginPath();zctx.moveTo(pad.l,pad.t);zctx.lineTo(pad.l,pad.t+H);zctx.lineTo(pad.l+W,pad.t+H);zctx.stroke();
  const GN=16,gw=W/GN,gh=H/GN,bw2=0.012;
  for(let gi=0;gi<GN;gi++){for(let gj=0;gj<GN;gj++){
    const gc=c0+(gi+0.5)*(c1-c0)/GN,gm=m0f+(gj+0.5)*(m1f-m0f)/GN;
    let d=0;inBin.forEach(s=>{d+=Math.exp(-0.5*((s.c-gc)**2+(s.m-gm)**2)/(bw2**2));});
    d/=inBin.length;
    zctx.fillStyle=rgba('blue',Math.min(0.85,d*10));
    const xa=Math.round(pad.l+gi*gw),ya=Math.round(pad.t+gj*gh);
    zctx.fillRect(xa,ya,Math.round(pad.l+(gi+1)*gw)-xa,Math.round(pad.t+(gj+1)*gh)-ya);
  }}
  zctx.fillStyle=rgba('fg',0.75);
  inBin.forEach(s=>{zctx.beginPath();zctx.arc(xcv(s.c),ymv(s.m),2,0,2*Math.PI);zctx.fill();});
  const fx=xcv(f[1]),fy=ymv(f[0]);
  zctx.strokeStyle=rgba('gold');zctx.lineWidth=2.5;
  zctx.beginPath();zctx.arc(fx,fy,7,0,2*Math.PI);zctx.stroke();
  const exc=W*f[2]/(c1-c0);
  zctx.lineWidth=1.5;
  zctx.beginPath();zctx.moveTo(fx-exc,fy);zctx.lineTo(fx+exc,fy);zctx.stroke();
  label(zctx,'peak ± σ',fx+Math.max(13,exc+7),fy,rgba('gold'),'left',11,true);
  zctx.font=font(11);zctx.fillStyle=T.fg2;zctx.textAlign='center';
  zctx.fillText('colour',pad.l+W/2,ZH-7);
  zctx.save();zctx.translate(13,pad.t+H/2);zctx.rotate(-Math.PI/2);zctx.fillText('F814W',0,0);zctx.restore();
  zctx.textAlign='right';zctx.fillText(`N=${f[6]}`,ZW-pad.r,14);
}

// ── step definitions ──────────────────────────────────────────────────────────
function makeSteps(){
const nBad  = stars.filter(s=>s.flag===0).length;
const nGood = stars.filter(s=>s.flag>=1).length;
const nSel  = stars.filter(s=>s.flag===2).length;
return [
  {
    num:'01',title:'NGC 0362 — Raw HUGS Photometry',
    body:`<p>This is the real HUGS Meth2 catalogue for <strong>NGC 0362</strong>, a globular cluster in the southern constellation Tucana.</p>
<p><strong>143,280 sources</strong> detected in F606W + F814W by HST/ACS. Each dot is one source — stars, blended sources, cosmic rays, field objects, everything.</p>
<p>You can clearly see the main sequence, the subgiant branch, and the red giant branch. But there's a lot of contamination to remove.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars,starCol(0.3),1.2);
      label(ctx,'N = 143,280 raw sources (8k shown)',PAD.l+CW-8,PAD.t+14,T.fg2,'right');
    },zoom:null
  },
  {
    num:'02',title:'Quality Cuts — 6 Criteria',
    body:`<p><span style="color:var(--bad)">■</span> <strong>Removed</strong> (${nBad.toLocaleString()} shown): bad PSF fit, blends, field stars, saturated.<br>
<span style="color:var(--accent2)">■</span> <strong>Kept</strong> (${nGood.toLocaleString()} shown): all 6 criteria satisfied.</p>
<p>Cuts applied: <code>qfit ≥ 0.98</code>, <code>|sharp| ≤ 0.05</code>, <code>Pmem ≥ 90%</code>, detected in both filters, <code>−1 ≤ colour ≤ 3</code>, <code>10 ≤ F814W ≤ 25</code>.</p>
<p>26% of sources survive: <strong>37,294 high-quality stars</strong> from 143,280 total.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars.filter(s=>s.flag===0),rgba('bad',0.55),1.3);
      plotStars(stars.filter(s=>s.flag>=1),rgba('kept',0.65),1.5);
      label(ctx,'■ removed',PAD.l+CW-8,PAD.t+14,rgba('bad'),'right',fs(),true);
      label(ctx,'■ kept',PAD.l+CW-8,PAD.t+14+fs()*1.7,rgba('kept'),'right',fs(),true);
    },zoom:null
  },
  {
    num:'03',title:'Bin in F814W (0.15 mag each)',
    body:`<p>The CMD is sliced into <strong>horizontal strips of 0.15 mag</strong> in F814W. Each <span style="color:var(--accent)">blue line</span> marks a bin boundary.</p>
<p>Within each strip, all stars are at approximately the same brightness. The question becomes: <em>what colour is the main sequence at this brightness?</em></p>
<p>Bins with fewer than 20 stars are skipped (removes very bright/faint slices where the CMD is sparse).</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      drawBinLines(0.4);
      plotStars(stars.filter(s=>s.flag>=1),rgba('kept',0.4),1.2);
    },zoom:null
  },
  {
    num:'04',title:'50-Bin Histogram → Modal Colour',
    body:`<p>Inside each bin we build a <strong>50-bin histogram</strong> of star colours (trimming top/bottom 1% first).</p>
<p>The <span style="color:var(--orange)">tallest bar</span> is the <strong>modal colour</strong> — the most common colour in that strip = one point on the ridge line.</p>
<p>The zoom panel shows the real 50-bin histogram for one mid-magnitude strip of NGC 0362.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      drawBinLines(0.15);
      plotStars(stars.filter(s=>s.flag>=1),rgba('kept',0.35),1.1);
      const exIdx=Math.floor(rbins.length*0.45);
      const exM=rbins[exIdx][0],exC=rbins[exIdx][1];
      const y0=cy(exM-0.075),y1=cy(exM+0.075);
      ctx.save();ctx.globalAlpha=0.2;ctx.fillStyle=rgba('orange');
      ctx.fillRect(PAD.l,Math.min(y0,y1),CW,Math.abs(y1-y0));ctx.restore();
      plotStars(stars.filter(s=>s.m>=exM-0.075&&s.m<exM+0.075),rgba('orange',0.9),2);
      const mx=cx(exC),my=cy(exM),lx=cx(0.84),ly=my+34*K;
      ctx.strokeStyle=rgba('orange');ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(lx-4,ly);ctx.stroke();
      ctx.fillStyle=rgba('ridge');ctx.beginPath();ctx.arc(mx,my,5*K,0,2*Math.PI);ctx.fill();
      ctx.strokeStyle=rgba('fg');ctx.stroke();
      label(ctx,`modal colour=${exC.toFixed(3)}`,lx,ly,rgba('orange'),'left',fs(),true);
    },
    zoom(){
      drawHistogram(Math.floor(rbins.length*0.45));
      document.getElementById('zoomLabel').textContent='Real NGC 0362 histogram — 50 colour bins, one 0.15-mag strip';
    }
  },
  {
    num:'05',title:'Ridge Line C_ridge(m)',
    body:`<p>Collecting one modal colour per bin and smoothing with a <strong>univariate spline</strong> (s = 0.002) gives the continuous function C<sub>ridge</sub>(m) — the <span style="color:var(--ridge)">red curve</span>.</p>
<p><span style="color:var(--orange)">Orange dots</span> are the raw modal points; the spline interpolates through them smoothly.</p>
<p>This ridge traces the spine of the main sequence through every magnitude level.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars.filter(s=>s.flag>=1),rgba('kept',0.35),1.1);
      ctx.fillStyle=rgba('orange',0.9);
      rbins.forEach(([m,c])=>{ctx.beginPath();ctx.arc(cx(c),cy(m),2.8*K,0,2*Math.PI);ctx.fill();});
      drawRidge(rgba('ridge'));
    },zoom:null
  },
  {
    num:'06',title:'MSTO — Bluest Point on the Ridge',
    body:`<p>The MSTO is where C<sub>ridge</sub>(m) reaches its <strong>minimum</strong> — the left-most (bluest) point on the ridge.</p>
<p>Search window: <strong>±2 mag</strong> around the expected MSTO (M<sub>F814W</sub> ≈ 3.8 converted using the Baumgardt & Vasiliev 2021 distance for NGC 0362).</p>
<p>For NGC 0362: <strong>MSTO at F814W = ${MSTO_M.toFixed(2)} mag</strong>, colour = ${MSTO_C.toFixed(3)}.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars,starCol(0.3),1.1);
      ctx.save();ctx.globalAlpha=0.07;ctx.fillStyle=rgba('orange');
      ctx.fillRect(PAD.l,cy(MSTO_M-2),CW,cy(MSTO_M+2)-cy(MSTO_M-2));ctx.restore();
      ctx.strokeStyle=rgba('orange',0.55);ctx.lineWidth=1;ctx.setLineDash([4,4]);
      [cy(MSTO_M-2),cy(MSTO_M+2)].forEach(y=>{ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+CW,y);ctx.stroke();});
      ctx.setLineDash([]);
      drawRidge(rgba('ridge'));drawMSTO();
      label(ctx,'±2 mag search window',PAD.l+CW-8,cy(MSTO_M-2)-11,rgba('orange'),'right');
    },zoom:null
  },
  {
    num:'07',title:'Ridge-Line Distance Criterion',
    body:`<p>A star at magnitude m<sub>i</sub> is selected if:</p>
<p><code>|c_i − C_ridge(m_i)| ≤ 0.04 mag</code></p>
<p>The <span style="color:var(--accent2)">green corridor</span> is exactly ±0.04 mag on each side of the ridge. 0.04 mag ≈ 2× the median MSTO colour error.</p>
<p><strong>${nSel.toLocaleString()} stars</strong> pass this criterion in the real dataset.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      drawMagWindow();drawCorridor();
      plotStars(stars.filter(s=>s.flag!==2),rgba('muted',0.2),1.0);
      plotStars(stars.filter(s=>s.flag===2),rgba('kept',0.75),1.8);
      drawRidge(rgba('ridge',0.7));
    },zoom:null
  },
  {
    num:'08',title:'Magnitude Window: MSTO−1 to MSTO+2.5',
    body:`<p>Further restrict to:</p>
<p><code>${(MSTO_M-1).toFixed(2)} ≤ F814W ≤ ${(MSTO_M+2.5).toFixed(2)}</code></p>
<p>1 mag above MSTO (base of subgiant branch) to 2.5 mag below (lower main sequence). Stars outside carry less age information.</p>
<p>This is the <strong>final MS sample</strong> going into the 2D bootstrap KDE.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      drawMagWindow();drawCorridor();
      plotStars(stars.filter(s=>s.flag!==2),starCol(0.1),1.0);
      plotStars(stars.filter(s=>s.flag===2),rgba('kept',0.8),1.8);
      drawRidge(rgba('ridge',0.6));drawMSTO();
    },zoom:null
  },
  {
    num:'09',title:'20 Equal-Width Bins + 2D Bootstrap KDE',
    body:`<p>The MS sample is divided into <strong>20 equal-width bins</strong> (<span style="color:var(--gold)">yellow lines</span>), each ~${((MSTO_M+2.5-(MSTO_M-1))/20).toFixed(3)} mag wide.</p>
<p>In each bin: <strong>500 bootstrap iterations</strong>, each perturbing star colours by their photometric errors, then a 2D Gaussian KDE on a 100×100 grid to find the density peak.</p>
<p>The zoom shows the real KDE density map + median peak (<span style="color:var(--gold)">gold circle</span>) for one fiducial bin.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars.filter(s=>s.flag!==2),rgba('muted',0.12),1.0);
      plotStars(stars.filter(s=>s.flag===2),rgba('kept',0.5),1.5);
      drawFidBinLines();drawRidge(rgba('ridge',0.5));
    },
    zoom(){
      drawFidKDE(Math.floor(fid.length/2));
      document.getElementById('zoomLabel').textContent=`Real NGC 0362 — 2D KDE in fiducial bin ${Math.floor(fid.length/2)+1}/20`;
    }
  },
  {
    num:'10',title:'20 Fiducial Points → SPInS Input',
    body:`<p>The <strong>20 gold points</strong> are the output — each is the median KDE peak across 500 bootstraps, with error bars from the standard deviation.</p>
<div class="stat-row">
  <div class="stat"><b>${fid.length}</b>fiducial pts</div>
  <div class="stat"><b>${MSTO_M.toFixed(2)}</b>MSTO (mag)</div>
  <div class="stat"><b>~0.004</b>typical σ_colour</div>
</div>
<p>These 20 points + the Salaris-rescaled [M/H] from APOGEE are written directly into <strong>SPInS</strong> as observational constraints. SPInS then runs MCMC (10 temperature chains, 80 walkers, 55k steps) to fit age, distance, and reddening simultaneously.</p>`,
    draw(){
      ctx.clearRect(0,0,VW,VH);drawAxes();
      plotStars(stars.filter(s=>s.flag!==2),rgba('muted',0.12),1.0);
      plotStars(stars.filter(s=>s.flag===2),rgba('kept',0.35),1.4);
      drawRidge(rgba('ridge',0.4));drawFidBinLines();drawFidPoints();
    },zoom:null
  }
];}

// ── step engine ───────────────────────────────────────────────────────────────
let steps=[], current=0;

function paint(){
  if(!steps.length)return;
  const s=steps[current];
  readTheme();
  sizePlot();
  ctx.save();s.draw();ctx.restore();           // restore() drops the plot clip
  if(s.zoom){sizeZoom();s.zoom();}
}

function renderStep(){
  const s=steps[current];
  document.getElementById('stepPill').textContent=`Step ${current+1} of ${steps.length}`;
  document.getElementById('stepInfo').innerHTML=`
    <div class="step-num">Step ${s.num}</div>
    <div class="step-title">${s.title}</div>
    <div class="step-body">${s.body}</div>`;
  document.getElementById('zoomPanel').style.display=s.zoom?'block':'none';
  document.querySelector('.sidebar').scrollTop=0;
  window.scrollTo(0,0);                       // on phones, show the new plot
  paint();
  const dotsEl=document.getElementById('dots');
  if(!dotsEl.children.length){
    steps.forEach((st,i)=>{
      const d=document.createElement('button');
      d.type='button';d.title=st.title;d.setAttribute('aria-label',`Go to step ${i+1}`);
      d.onclick=()=>{current=i;renderStep();};
      dotsEl.appendChild(d);
    });
  }
  [...dotsEl.children].forEach((d,i)=>{
    d.className='dot'+(i===current?' active':i<current?' done':'');
    if(i===current)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current');
  });
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===steps.length-1;
  document.getElementById('nextBtn').textContent=current===steps.length-1?'Done ✓':'Next →';
}

function go(dir){current=Math.max(0,Math.min(steps.length-1,current+dir));renderStep();}

let queued=false;
function repaint(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;paint();});}
window.addEventListener('resize',repaint);
matchMedia('(prefers-color-scheme: light)').addEventListener('change',repaint);
new MutationObserver(repaint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts){
  document.fonts.ready.then(repaint);
  document.fonts.addEventListener('loadingdone',repaint);
}
document.addEventListener('keydown',e=>{
  if(!steps.length||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'){go(1);e.preventDefault();}
  if(e.key==='ArrowLeft'){go(-1);e.preventDefault();}
});

// ── boot: fetch data then start ───────────────────────────────────────────────
fetch('ngc0362_data.json')
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(D=>{
    init(D);
    steps=makeSteps();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    renderStep();
  })
  .catch(e=>{
    document.getElementById('loading').innerHTML=
      `<p style="color:var(--bad);text-align:center">Could not load ngc0362_data.json<br><small>${e}</small><br><br>Make sure both files are in the same folder.</p>`;
  });
</script>
